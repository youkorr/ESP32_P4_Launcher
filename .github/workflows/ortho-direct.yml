name: Ortho native DIRECT damage synchronization
on:
  push:
    branches: [ortho-direct]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          for test in fb_fence fb_triple ortho_coords ortho_damage; do
            cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined tests/host/test_$test.c -o /tmp/$test
            /tmp/$test
          done
  compile:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: m5stack_tab5, mode: "off"}
          - {board: m5stack_tab5, mode: "private"}
          - {board: m5stack_tab5, mode: "native"}
          - {board: m5stack_tab5, mode: "native-dual"}
          - {board: m5stack_tab5, mode: "native-direct"}
          - {board: m5stack_tab5, mode: "native-direct-dual"}
          - {board: guition_p4_43, mode: "off"}
          - {board: guition_p4_43_v3, mode: "off"}
          - {board: guition_p4_7, mode: "off"}
          - {board: guition_p4_7_v3, mode: "off"}
          - {board: waveshare_p4_35, mode: "off"}
          - {board: elecrow_p4_aio, mode: "off"}
    steps:
      - uses: actions/checkout@v4
      - name: Build experimental firmware
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          MODE: ${{ matrix.mode }}
        run: |
          set -eo pipefail
          . "$IDF_PATH/export.sh" > /dev/null
          cd launcher
          printf '\nCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=y\nCONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER=y\n' >> sdkconfig.defaults
          if [ "$MODE" != off ]; then echo CONFIG_LX_USE_ORTHO=y >> sdkconfig.defaults; fi
          if [[ "$MODE" == native* ]]; then echo CONFIG_LX_ORTHO_NATIVE=y >> sdkconfig.defaults; fi
          if [[ "$MODE" == native-direct* ]]; then echo CONFIG_LX_ORTHO_DIRECT=y >> sdkconfig.defaults; fi
          if [[ "$MODE" == *dual ]]; then printf '\nCONFIG_LV_OS_FREERTOS=y\nCONFIG_LX_ORTHO_TWO_CORES=y\n' >> sdkconfig.defaults; fi
          idf.py -B build_native -DLX_BOARD="$BOARD" build
          if [[ "$MODE" == native* ]]; then
            grep -x CONFIG_LX_ORTHO_NATIVE=y "sdkconfig.$BOARD"
          fi
          if [[ "$MODE" == native-direct* ]]; then
            grep -x CONFIG_LX_ORTHO_DIRECT=y "sdkconfig.$BOARD"
          fi
          if [[ "$MODE" == *dual ]]; then
            grep -x CONFIG_LX_ORTHO_TWO_CORES=y "sdkconfig.$BOARD"
          fi
          idf.py -B build_native -DLX_BOARD="$BOARD" size
      - uses: actions/upload-artifact@v4
        if: matrix.board == 'm5stack_tab5'
        with:
          name: experimental-tab5-${{ matrix.mode }}
          path: |
            launcher/build_native/launcher_m5stack_tab5.bin
            launcher/build_native/bootloader/bootloader.bin
            launcher/build_native/partition_table/partition-table.bin
            launcher/build_native/flasher_args.json
            launcher/sdkconfig.m5stack_tab5
          if-no-files-found: error
