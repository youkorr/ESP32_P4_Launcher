name: Ortho performance safeguards
on:
  push:
    branches: [ortho-performance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined tests/host/test_fb_fence.c -o /tmp/fence
          /tmp/fence
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined tests/host/test_ortho_coords.c -o /tmp/coords
          /tmp/coords
  compile:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: m5stack_tab5, mode: "off"}
          - {board: m5stack_tab5, mode: "single"}
          - {board: m5stack_tab5, mode: "dual"}
          - {board: guition_p4_43, mode: "off"}
          - {board: guition_p4_43_v3, mode: "off"}
          - {board: guition_p4_7, mode: "off"}
          - {board: guition_p4_7_v3, mode: "off"}
          - {board: waveshare_p4_35, mode: "off"}
          - {board: elecrow_p4_aio, mode: "off"}
    steps:
      - uses: actions/checkout@v4
      - name: Build experimental firmware
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          MODE: ${{ matrix.mode }}
        run: |
          set -eo pipefail
          . "$IDF_PATH/export.sh" > /dev/null
          cd launcher
          printf '\nCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=y\nCONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER=y\n' >> sdkconfig.defaults
          if [ "$MODE" != off ]; then echo CONFIG_LX_USE_ORTHO=y >> sdkconfig.defaults; fi
          if [ "$MODE" = dual ]; then
            printf '\nCONFIG_LV_OS_FREERTOS=y\nCONFIG_LX_ORTHO_TWO_CORES=y\n' >> sdkconfig.defaults
          fi
          idf.py -B build_perf -DLX_BOARD="$BOARD" build
          grep -x CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=y "sdkconfig.$BOARD"
          if [ "$MODE" = dual ]; then
            grep -x CONFIG_LV_OS_FREERTOS=y "sdkconfig.$BOARD"
            grep -x CONFIG_LX_ORTHO_TWO_CORES=y "sdkconfig.$BOARD"
          fi
          idf.py -B build_perf -DLX_BOARD="$BOARD" size
